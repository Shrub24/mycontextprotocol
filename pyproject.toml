[project]
name = "mycontextprotocol"
version = "0.1.0"
description = "Self-hosted personal memory and context management system"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "mycontextprotocol contributors" }]

dependencies = [
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0",
  "httpx>=0.28.1",
  "mem0ai>=0.1.34",
  "lightrag-hku>=0.0.0.5rc7",
  "instructor>=1.7.3",
  "sqlalchemy>=2.0.37",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.4",
  "pgvector>=0.3.8",
  "redis>=5.2.1",
  "pydantic-settings>=2.7.1",
  "numpy>=2.0",
  "llama-index>=0.14.12",
  "llama-index-vector-stores-postgres>=0.7.2",
  "llama-index-embeddings-ollama>=0.5.0",
]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "basedpyright>=1.22.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # Ruff-specific rules
  "PL",
  "C90",
  "ARG",
  "A",
  "TC",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

ignore = [
  "E501", # line too long (handled by formatter)
]

fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["mycontextprotocol"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
pythonPlatform = "Linux"

include = ["src"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]

reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true
reportTypedDictNotRequiredAccess = false
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInvalidStubStatement = true
reportInconsistentConstructor = true
reportUnknownParameterType = true
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingParameterType = true
reportMissingTypeArgument = true
reportPrivateUsage = true
reportPrivateImportUsage = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=mycontextprotocol",
  "--cov-report=term-missing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
