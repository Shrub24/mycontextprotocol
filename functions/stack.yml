provider:
  name: openfaas
  gateway: http://127.0.0.1:8080

functions:
  add-memory:
    lang: python3-http
    handler: ./add-memory
    image: add-memory:latest
    environment:
      POSTGRES_HOST: postgresql.database.svc.cluster.local
      POSTGRES_PORT: "5432"
      POSTGRES_DB: memorydb
      POSTGRES_USER: memuser
    secrets:
      - postgres-password
    annotations:
      topic: ""

  process-inbox:
    lang: python3-http
    handler: ./process-inbox
    image: process-inbox:latest
    environment:
      POSTGRES_HOST: postgresql.database.svc.cluster.local
      POSTGRES_PORT: "5432"
      POSTGRES_DB: memorydb
      POSTGRES_USER: memuser
      MEM0_API_URL: http://mem0.mem0.svc.cluster.local:8000
    secrets:
      - postgres-password
    annotations:
      schedule: "*/10 * * * *"
      topic: ""

  embed-doc:
    lang: python3-http
    handler: ./embed-doc
    image: embed-doc:latest
    environment:
      POSTGRES_HOST: postgresql.database.svc.cluster.local
      POSTGRES_PORT: "5432"
      POSTGRES_DB: memorydb
      POSTGRES_USER: memuser
    secrets:
      - postgres-password
      - openai-api-key
    annotations:
      topic: "embed-queue"

  query-memory:
    lang: python3-http
    handler: ./query-memory
    image: query-memory:latest
    environment:
      POSTGRES_HOST: postgresql.database.svc.cluster.local
      POSTGRES_PORT: "5432"
      POSTGRES_DB: memorydb
      POSTGRES_USER: memuser
      MEM0_API_URL: http://mem0.mem0.svc.cluster.local:8000
    secrets:
      - postgres-password
    annotations:
      topic: ""
