pre-commit:
  parallel: true
  commands:
    format-check:
      glob: "*.py"
      run: ruff format --check {staged_files}
    
    lint:
      glob: "*.py"
      run: ruff check {staged_files}
    
    typecheck:
      glob: "*.py"
      run: basedpyright {staged_files}

pre-push:
  commands:
    full-check:
      run: task check
