glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    python:
      glob: "*.py"
      exclude: "alembic/"
      stage_fixed: true
      run: |
        ruff check --fix {staged_files}
        ruff format {staged_files}
        ruff check {staged_files}
        basedpyright src tests

    yaml:
      glob: "**/*.{yaml,yml}"
      exclude:
        - alembic/|infra/k8s/charts/**/templates/**
        - infra/k8s/charts/**/charts/**
      stage_fixed: true
      run: |
        set -- {staged_files}
        if [ $# -eq 0 ]; then exit 0; fi
        yamlfmt -conf .yamlfmt.yaml "$@"
        yamllint -c .yamllint.yaml "$@"

    kube-linter:
      glob: "infra/k8s/**/*.yaml"
      run: |
        set -- {staged_files}
        if [ $# -eq 0 ]; then exit 0; fi
        kube-linter lint "$@"

    helm-lint:
      glob: "infra/k8s/charts/**/*.yaml"
      run: |-
        cd infra/k8s
        for chart in charts/*; do
          if [ -f "$chart/Chart.yaml" ]; then
            helm dependency update "$chart"
          fi
        done
        helm lint charts/*
