pre-commit:
  parallel: true
  commands:
    python:
      glob: "*.py"
      exclude: "alembic/"
      stage_fixed: true
      run: |
        ruff check --fix {staged_files}
        ruff format {staged_files}
        ruff check {staged_files}
        basedpyright src tests

    yaml:
      glob: "**/*.{yaml,yml}"
      exclude: "(alembic/|infra/k8s/charts/.*/templates/)"
      stage_fixed: true
      run: |
        yamlfmt -conf .yamlfmt.yaml {staged_files}
        yamllint -c .yamllint.yaml {staged_files}

    kube-linter:
      glob: "infra/k8s/**/*.yaml"
      run: kube-linter lint {staged_files}

    helm-lint:
      glob: "infra/k8s/charts/**/*.yaml"
      run: cd infra/k8s && helm lint charts/*
