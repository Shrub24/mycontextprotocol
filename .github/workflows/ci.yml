name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v6

      - name: Setup Nix + Cachix
        uses: ./.github/actions/setup-nix
        with:
          ci_age_key: ${{ secrets.CI_AGE_KEY }}
          skip_push: ${{ github.event_name == 'pull_request' }}

      - name: Setup dev environment
        run: nix develop --command bash -c "uv sync"

      - name: Format check
        run: nix develop --command bash -c "task format"

      - name: Lint
        run: nix develop --command bash -c "task lint"

      - name: Type check
        run: nix develop --command bash -c "task typecheck"

  test:
    name: Tests
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix + Cachix
        uses: ./.github/actions/setup-nix
        with:
          ci_age_key: ${{ secrets.CI_AGE_KEY }}
          skip_push: ${{ github.event_name == 'pull_request' }}

      - name: Setup dev environment
        run: |
          nix develop --command bash -c "uv sync"

      - name: Run tests
        run: nix develop --command bash -c "task test:cov"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
