name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v6

      - name: Setup Nix + Cachix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skip_push: ${{ github.event_name == 'pull_request' }}

      - name: Quality checks
        run: nix develop --command bash -c "uv sync && task format && task lint && task typecheck"

  test:
    name: Tests
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v6

      - name: Setup Nix + Cachix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skip_push: ${{ github.event_name == 'pull_request' }}

      - name: Run tests
        run: nix develop --command bash -c "uv sync && task test:cov"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
