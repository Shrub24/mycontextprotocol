name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v6

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@master
        with:
          extra_nix_config: |
            extra-substituters = https://shrub24.cachix.org
            extra-substituters = https://cache.nixos.org
            extra-trusted-public-keys = shrub24.cachix.org-1:QMgWTCaMI7DSDdmvmKrsQ9cQwwTfw3zWRFz2yuxeriU=
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Decrypt Cachix token
        env:
          CI_AGE_KEY: ${{ secrets.CI_AGE_KEY }}
        run: |
          mkdir -p .github/secrets
          echo "$CI_AGE_KEY" > .github/secrets/ci-age.key
          nix develop --command bash -c "sops -d .github/secrets/cachix.sops.json > /tmp/cachix.json"
          CACHIX_AUTH_TOKEN=$(python -c "import json; print(json.load(open('/tmp/cachix.json'))['CACHIX_AUTH_TOKEN'])")
          echo "CACHIX_AUTH_TOKEN=$CACHIX_AUTH_TOKEN" >> $GITHUB_ENV

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: shrub24
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Setup dev environment
        run: nix develop --command bash -c "uv sync"

      - name: Format check
        run: nix develop --command bash -c "task format"

      - name: Lint
        run: nix develop --command bash -c "task lint"

      - name: Type check
        run: nix develop --command bash -c "task typecheck"

  test:
    name: Tests
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@master
        with:
          extra_nix_config: |
            extra-substituters = https://shrub24.cachix.org
            extra-substituters = https://cache.nixos.org
            extra-trusted-public-keys = shrub24.cachix.org-1:QMgWTCaMI7DSDdmvmKrsQ9cQwwTfw3zWRFz2yuxeriU=
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Decrypt Cachix token
        env:
          CI_AGE_KEY: ${{ secrets.CI_AGE_KEY }}
        run: |
          mkdir -p .github/secrets
          echo "$CI_AGE_KEY" > .github/secrets/ci-age.key
          nix develop --command bash -c "sops -d .github/secrets/cachix.sops.json > /tmp/cachix.json"
          CACHIX_AUTH_TOKEN=$(python -c "import json; print(json.load(open('/tmp/cachix.json'))['CACHIX_AUTH_TOKEN'])")
          echo "CACHIX_AUTH_TOKEN=$CACHIX_AUTH_TOKEN" >> $GITHUB_ENV

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: shrub24
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Setup dev environment
        run: |
          nix develop --command bash -c "uv sync"

      - name: Run tests
        run: nix develop --command bash -c "task test:cov"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
