name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup dev environment
        run: nix develop --command bash -c "uv sync"

      - name: Format check
        run: nix develop --command bash -c "task format"

      - name: Lint
        run: nix develop --command bash -c "task lint"

      - name: Type check
        run: nix develop --command bash -c "task typecheck"

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup dev environment
        run: |
          nix develop --command bash -c "uv sync"

      - name: Run tests
        run: nix develop --command bash -c "task test:cov"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
