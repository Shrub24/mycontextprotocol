name: Setup Nix (Lix + Cachix)
description: Install Lix and configure Cachix

inputs:
  cachix_auth_token:
    description: Cachix auth token for push (optional)
    required: false
    default: ""
  skip_push:
    description: Skip pushing to Cachix (e.g., on PRs)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Lix
      uses: samueldr/lix-gha-installer-action@f526e761e1ad201b0f4231f61a2a569f17bcc2ac

    - name: Setup Cachix (pull)
      uses: cachix/cachix-action@v15
      with:
        name: shrub24
        skipPush: true

    - name: Setup Cachix (push)
      if: ${{ inputs.skip_push != 'true' && inputs.cachix_auth_token != '' }}
      uses: cachix/cachix-action@v15
      with:
        name: shrub24
        authToken: ${{ inputs.cachix_auth_token }}
        skipPush: false
