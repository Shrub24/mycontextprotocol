version: "3"

vars:
  SRC_DIR: src
  TEST_DIR: tests

tasks:
  default:
    desc: Run type checking with basedpyright
    cmds:
      - basedpyright {{.SRC_DIR}} {{.TEST_DIR}}

  src:
    desc: Run type checking on source code only
    cmds:
      - uv run basedpyright {{.SRC_DIR}}

  tests:
    desc: Run type checking on tests only
    cmds:
      - uv run basedpyright {{.TEST_DIR}}

  watch:
    desc: Run type checking in watch mode
    cmds:
      - uv run basedpyright --watch {{.SRC_DIR}} {{.TEST_DIR}}
