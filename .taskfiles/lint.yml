version: "3"

tasks:
  default:
    desc: Run all quality checks (Python + infrastructure)
    cmds:
      - task lint:python
      - task lint:yaml
      - task lint:kube
      - task lint:helm
      - task lint:kubeconform

  python:
    desc: Run all Python linting and type checks
    cmds:
      - ruff check src tests
      - basedpyright src tests

  infra:
    desc: Run all infrastructure checks in parallel
    deps: [helm, kube, yaml]

  lint:
    cmds:
      - ruff check src tests

  typecheck:
    cmds:
      - basedpyright src tests

  helm:
    dir: infra/k8s
    cmds:
      - helm lint charts/gateway
      - helm lint charts/worker

  kube:
    cmds:
      - |-
        tmpfile=$(mktemp)
        cd infra/k8s
        helmfile -e local -l tier=app template > "$tmpfile"
        kube-linter lint "$tmpfile"
        rm -f "$tmpfile"

  yaml:
    cmds:
      - yamllint .

  kubeconform:
    dir: infra/k8s
    cmds:
      - |-
        tmpfile=$(mktemp)
        helmfile -e local -l tier=app template > "$tmpfile"
        schema_url='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json'
        kubeconform \
          -summary \
          -skip ScaledJob \
          -schema-location default \
          -schema-location "$schema_url" \
          "$tmpfile"
        rm -f "$tmpfile"
