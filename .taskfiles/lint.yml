version: "3"

tasks:
  default:
    desc: Run all quality checks (Python + infrastructure)
    cmds:
      - task lint:python
      - task lint:yaml
      - task lint:kube
      - task lint:helm
      - task lint:kubeconform

  python:
    desc: Run all Python linting and type checks
    cmds:
      - ruff check src tests
      - basedpyright src tests

  infra:
    desc: Run all infrastructure checks in parallel
    deps: [helm, kube, yaml]

  lint:
    cmds:
      - ruff check src tests

  typecheck:
    cmds:
      - basedpyright src tests

  helm:
    dir: infra/k8s
    cmds:
      - helm lint charts/gateway
      - helm lint charts/worker

  kube:
    cmds:
      - kube-linter lint infra/k8s/

  yaml:
    cmds:
      - yamllint .

  kubeconform:
    dir: infra/k8s
    cmds:
      - |-
        helm template gateway charts/gateway | \
        kubeconform \
          -summary \
          -skip ScaledJob \
          -schema-location default \
          -schema-location \
          'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - |-
        helm template worker charts/worker | \
        kubeconform \
          -summary \
          -skip ScaledJob \
          -schema-location default \
          -schema-location \
          'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
