# Gateway default configuration
replicaCount: 2

image:
  repository: ghcr.io/shrub24/mycontextprotocol
  tag: gateway-latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: 1000m
