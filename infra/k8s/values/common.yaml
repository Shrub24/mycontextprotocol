# Shared Helm Values for All Environments
# 
# This file contains configuration that is consistent across all deployment
# environments (local and production). Environment-specific overrides are in:
# - values/local.yaml
# - values/production.yaml
#
# Any value defined here can be overridden in environment-specific files.

# ============================================================================
# PostgreSQL 16 with pgvector Extension
# ============================================================================
# Database: memorydb (for memory features)
# User: memuser
# Extensions: pgvector (for vector similarity search)

postgresql:
  # Authentication
  auth:
    username: memuser
    database: memorydb
    # Password must be provided via environment variable
    password: "{{ requiredEnv \"POSTGRES_PASSWORD\" }}"
    postgresPassword: "{{ requiredEnv \"POSTGRES_PASSWORD\" }}"

  # Primary database configuration
  primary:
    # Enable pgvector extension
    extendedConfiguration: |
      shared_preload_libraries = 'vector'
    
    # Initialize database with scripts
    initdb:
      scripts:
        # TODO: Add schema initialization scripts here
        # Schema will include tables for:
        # - memory_embeddings (vector storage)
        # - memory_contexts (memory metadata)
        # - memory_logs (audit trail)
        init.sql: |
          -- Schema initialization placeholder
          -- Actual schema setup to be added
          CREATE EXTENSION IF NOT EXISTS pgvector;

  # Service configuration
  service:
    type: ClusterIP
    port: 5432

  # Metrics disabled by default (environment-specific override)
  metrics:
    enabled: false

# ============================================================================
# MinIO Object Storage (S3-Compatible)
# ============================================================================
# Storage for:
# - vault-files (user documents and uploads)
# - vault-exports (generated reports and exports)

minio:
  # Authentication
  auth:
    rootUser: admin
    rootPassword: "{{ requiredEnv \"MINIO_ROOT_PASSWORD\" }}"

  # Deployment mode
  mode: standalone

  # Default buckets to create
  defaultBuckets: "vault-files,vault-exports"

  # Service configuration
  service:
    type: ClusterIP
    port: 9000

  # API service (for S3 access)
  apiService:
    type: ClusterIP
    port: 9000

  # Console service (web UI)
  consoleService:
    type: ClusterIP
    port: 9001

  # Persistence configuration
  persistence:
    enabled: true
    # Size overridden in environment-specific files
    # storageClass overridden in environment-specific files

# ============================================================================
# OpenFaaS Serverless Functions Platform
# ============================================================================
# Handles asynchronous job processing and background tasks
# Uses NATS message queue for reliable async execution

openfaas:
  # Namespace for function deployments
  functionNamespace: openfaas-fn

  # Enable async functions with NATS
  async: true
  
  # Enable basic authentication
  basicAuthPlugin:
    enabled: true

  # Gateway configuration (API endpoint)
  gateway:
    replicas: 1
    # Resources overridden in environment-specific files
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "200m"

  # Queue worker (for async job processing)
  queueWorker:
    replicas: 1
    # Resources overridden in environment-specific files
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "200m"

  # NATS configuration (message queue)
  nats:
    enabled: true

  # Image pull policy for consistency
  openfaasImagePullPolicy: IfNotPresent

  # Autoscaling for functions
  autoscaler:
    enabled: true
