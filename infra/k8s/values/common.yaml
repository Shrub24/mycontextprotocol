# Common configuration shared between gateway and worker charts

config:
  dragonfly:
    host: dragonfly
    port: "6379"
    queueName: mcp_ingest

  postgres:
    appSecretName: mycontextprotocol-db-app

  app:
    postgresDatabase: mycontextprotocol

  mem0:
    postgresHost: mycontextprotocol-db-rw
    postgresPort: "5432"
    postgresDatabase: mem0
    postgresUser: app

  llamaindex:
    postgresHost: mycontextprotocol-db-rw
    postgresPort: "5432"
    postgresDatabase: llamaindex
    postgresUser: app
