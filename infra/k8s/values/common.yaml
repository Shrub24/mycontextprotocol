# Common configuration shared across app workloads

config:
  dragonfly:
    host: dragonfly
    port: "6379"
    queueName: mcp_ingest

  postgres:
    appSecretName: cnpg-cluster-app

  openai:
    apiBase: ""

  app:
    postgresDatabase: mycontextprotocol

  mem0:
    postgresHost: mycontextprotocol-db-rw
    postgresPort: "5432"
    postgresDatabase: mem0
    postgresUser: app

  llamaindex:
    postgresHost: mycontextprotocol-db-rw
    postgresPort: "5432"
    postgresDatabase: llamaindex
    postgresUser: app

  lightrag:
    postgresHost: mycontextprotocol-db-rw
    postgresPort: "5432"
    postgresDatabase: lightrag
    postgresUser: app
    postgresWorkspace: default
    openaiApiBase: ""
