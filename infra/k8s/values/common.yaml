# Shared Helm Values for All Environments
# 
# This file contains configuration that is consistent across all deployment
# environments (local and production). Environment-specific overrides are in:
# - values/local.yaml
# - values/production.yaml

postgresql:
  auth:
    username: memuser
    database: memorydb
    password: "{{ requiredEnv \"POSTGRES_PASSWORD\" }}"
    postgresPassword: "{{ requiredEnv \"POSTGRES_PASSWORD\" }}"

  primary:
    extendedConfiguration: |
      shared_preload_libraries = 'vector'
    
    initdb:
      scripts:
        init.sql: |
          CREATE EXTENSION IF NOT EXISTS pgvector;

minio:
  auth:
    rootUser: admin
    rootPassword: "{{ requiredEnv \"MINIO_ROOT_PASSWORD\" }}"

  mode: standalone
  defaultBuckets: "vault-files,vault-exports"
  
  persistence:
    enabled: true

openfaas:
  functionNamespace: openfaas-fn
  async: true
  
  basicAuthPlugin:
    enabled: true

  gateway:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "200m"

  queueWorker:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "200m"

  nats:
    enabled: true

  autoscaler:
    enabled: true

embedding:
  provider: openai
  dimension: 768
  
  openai:
    model: text-embedding-3-small
    
  ollama:
    model: nomic-embed-text
    host: http://ollama.embedding:11434
