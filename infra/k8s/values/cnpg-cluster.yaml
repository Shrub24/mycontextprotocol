cluster:
  name: mycontextprotocol-db
  instances: 1
  
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  
  bootstrap:
    initdb:
      database: myapp
      owner: myapp
      secret:
        name: postgresql-credentials
  
  storage:
    size: 10Gi
    storageClass: local-path
  
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
    
    pg_hba:
      - host all all all scram-sha-256
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
