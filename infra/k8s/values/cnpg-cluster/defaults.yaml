cluster:
  name: mycontextprotocol-db
  instances: 1

  imageName: ghcr.io/shrub24/mycontextprotocol:postgres-age-latest

  bootstrap:
    initdb:
      database: mycontextprotocol
      owner: app
      secret:
        name: postgresql-credentials
      postInitSQL:
        - CREATE DATABASE mem0 OWNER app;
        - CREATE DATABASE llamaindex OWNER app;
        - CREATE DATABASE lightrag OWNER app;
        - \connect mem0
        - CREATE EXTENSION IF NOT EXISTS vector;
        - \connect llamaindex
        - CREATE EXTENSION IF NOT EXISTS vector;
        - \connect lightrag
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS age;

  storage:
    size: 10Gi
    storageClass: local-path

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      shared_preload_libraries: "age,vector"
      search_path: "ag_catalog, \"$user\", public"

    pg_hba:
      - host all all all scram-sha-256

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
