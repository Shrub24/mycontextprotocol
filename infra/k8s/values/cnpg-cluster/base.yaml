cluster:
  name: mycontextprotocol-db
  instances: 1

  initdb:
    database: mycontextprotocol
    owner: app
    postInitTemplateSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;
      - CREATE EXTENSION IF NOT EXISTS age;
    postInitApplicationSQL:
      - CREATE DATABASE mem0 OWNER app;
      - CREATE DATABASE llamaindex OWNER app;
      - CREATE DATABASE lightrag OWNER app;

  storage:
    size: 10Gi
    storageClass: local-path

  postgresql:
    shared_preload_libraries:
      - age
      - vector
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      search_path: "ag_catalog, \"$user\", public"

    pg_hba:
      - host all all all scram-sha-256

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
