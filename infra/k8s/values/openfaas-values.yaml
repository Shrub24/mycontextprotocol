# OpenFaaS Configuration
gateway:
  replicas: 1
  resources:
    requests:
      memory: "120Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Direct NodePort access (no ingress needed for k3s local)
  service:
    type: NodePort
    nodePort: 31112

queueWorker:
  replicas: 1
  resources:
    requests:
      memory: "120Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# NATS messaging
nats:
  resources:
    requests:
      memory: "120Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Create function namespace
openfaasImagePullPolicy: "IfNotPresent"

# Enable async functions
async: true

# Autoscaling
autoscaler:
  enabled: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
