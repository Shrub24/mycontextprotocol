bases:
  - bases/environments.yaml

helmDefaults:
  timeout: 600
  wait: true
  createNamespace: true

repositories:
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: kedacore
    url: https://kedacore.github.io/charts

releases:
  - name: cnpg-operator
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg

  - name: cnpg-cluster
    namespace: mycontextprotocol
    chart: cnpg/cluster
    needs:
      - cnpg-system/cnpg-operator
    values:
      - values/cnpg-cluster/base.yaml
      - values/cnpg-cluster/{{ .Environment.Name }}.yaml

  - name: dragonfly-operator
    namespace: dragonfly-system
    chart: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
    version: v1.3.1

  - name: dragonfly
    namespace: mycontextprotocol
    chart: oci://ghcr.io/dragonflydb/dragonfly/helm/dragonfly
    version: v1.36.0
    needs:
      - dragonfly-system/dragonfly-operator
    values:
      - values/dragonfly/base.yaml
      - values/dragonfly/{{ .Environment.Name }}.yaml

  - name: keda
    namespace: keda
    chart: kedacore/keda

  - name: lightrag
    namespace: lightrag
    chart: /tmp/lightrag-repo/k8s-deploy/lightrag
    needs:
      - mycontextprotocol/cnpg-cluster
    values:
      - values/common.yaml
      - values/lightrag/base.yaml
      - values/lightrag/{{ .Environment.Name }}.yaml

  - name: gateway
    namespace: mycontextprotocol
    chart: ./charts/gateway
    needs:
      - mycontextprotocol/cnpg-cluster
      - mycontextprotocol/dragonfly
    values:
      - values/common.yaml
      - values/gateway/{{ .Environment.Name }}.yaml
    secrets:
      - secrets/common.yaml
      - secrets/gateway/{{ .Environment.Name }}.yaml

  - name: worker
    namespace: mycontextprotocol
    chart: ./charts/worker
    needs:
      - mycontextprotocol/cnpg-cluster
      - mycontextprotocol/dragonfly
      - keda/keda
    values:
      - values/common.yaml
      - values/worker/{{ .Environment.Name }}.yaml
    secrets:
      - secrets/common.yaml
      - secrets/worker/{{ .Environment.Name }}.yaml
