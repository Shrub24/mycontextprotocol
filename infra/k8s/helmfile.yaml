bases:
  - bases/environments.yaml

helmDefaults:
  timeout: 600
  wait: true
  createNamespace: true

repositories:
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: kedacore
    url: https://kedacore.github.io/charts

releases:
  - name: cnpg-operator
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg

  - name: cnpg-cluster
    namespace: mycontextprotocol
    chart: cnpg/cluster
    needs:
      - cnpg-system/cnpg-operator
    values:
      - values/cnpg-cluster/defaults.yaml
      - values/cnpg-cluster/{{ .Environment.Name}}.yaml

  - name: dragonfly-operator
    namespace: dragonfly-system
    chart: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator

  - name: dragonfly
    namespace: mycontextprotocol
    chart: oci://ghcr.io/dragonflydb/dragonfly/helm/dragonfly
    needs:
      - dragonfly-system/dragonfly-operator
      - mycontextprotocol/dragonfly-secrets
    values:
      - values/dragonfly/defaults.yaml
      - values/dragonfly/{{ .Environment.Name }}.yaml

  - name: keda
    namespace: keda
    chart: kedacore/keda

  - name: lightrag
    namespace: mycontextprotocol
    chart: ./charts/lightrag
    needs:
      - mycontextprotocol/cnpg-cluster
      - mycontextprotocol/external-secrets
    values:
      - values/lightrag/defaults.yaml
      - values/lightrag/{{ .Environment.Name }}.yaml

  - name: dragonfly-secrets
    namespace: mycontextprotocol
    chart: ./charts/dragonfly-secrets

  - name: external-secrets
    namespace: mycontextprotocol
    chart: ./charts/external-secrets
    secrets:
      - secrets/common.yaml

  - name: gateway
    namespace: mycontextprotocol
    chart: ./charts/gateway
    needs:
      - mycontextprotocol/cnpg-cluster
      - mycontextprotocol/dragonfly
      - mycontextprotocol/dragonfly-secrets
      - mycontextprotocol/external-secrets
    values:
      - values/common.yaml
      - values/gateway/{{ .Environment.Name }}.yaml

  - name: worker
    namespace: mycontextprotocol
    chart: ./charts/worker
    needs:
      - mycontextprotocol/cnpg-cluster
      - mycontextprotocol/dragonfly
      - mycontextprotocol/dragonfly-secrets
      - mycontextprotocol/external-secrets
      - mycontextprotocol/gateway
      - keda/keda
    values:
      - values/common.yaml
      - values/worker/{{ .Environment.Name }}.yaml
