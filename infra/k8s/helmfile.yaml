# Helmfile for mycontextprotocol K3s Deployment
#
# Manages core infrastructure services:
# - PostgreSQL 18 with pgvector (database via CloudNativePG)
# - Dragonfly (Redis-compatible queue + cache)
# - KEDA (event-driven autoscaling)
#
# Environments:
# - local: k3d development (limited resources)
# - production: Oracle Cloud (4 OCPU, 24GB RAM)
#
# Usage:
#   helmfile -e local sync       # Deploy to local
#   helmfile -e production sync  # Deploy to production
#   helmfile diff                # Preview changes
#   helmfile destroy             # Remove all releases

repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: kedacore
    url: https://kedacore.github.io/charts
  - name: dragonfly
    url: https://dragonflydb.github.io/dragonfly-operator

---
environments:
  local:
    values:
      - values/local.yaml
  production:
    values:
      - values/production.yaml
---
helmDefaults:
  # Wait for deployment completion before returning
  wait: true
  # Timeout for each release deployment
  timeout: 600
  # Don't recreate pods on release upgrade
  recreatePods: false
  # Don't force recreate releases
  force: false


releases:
  # ============================================================================
  # CloudNativePG Operator
  # ============================================================================
  # Declarative PostgreSQL cluster management with automatic failover
  # Handles backup/restore and cluster lifecycle
  - name: cnpg-operator
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    createNamespace: true
    values:
      - values/common.yaml
      - values/{{ .Environment.Name }}.yaml
    missingFileHandler: Warn

  # ============================================================================
  # PostgreSQL Cluster (CloudNativePG)
  # ============================================================================
  # Primary data store with pgvector extension
  # Managed by CloudNativePG operator
  - name: postgresql-cluster
    namespace: database
    chart: cnpg/cluster
    createNamespace: true
    needs:
      - cnpg-system/cnpg-operator
    values:
      - values/cnpg-cluster.yaml
      - values/{{ .Environment.Name }}.yaml
    missingFileHandler: Warn

  # ============================================================================
  # Dragonfly
  # ============================================================================
  # Redis-compatible in-memory store for queues and caching
  # Used for task queue and future context caching
  - name: dragonfly-operator
    namespace: dragonfly-system
    chart: dragonfly/dragonfly-operator
    version: v1.1.8
    createNamespace: true
    values:
      - values/common.yaml
      - values/{{ .Environment.Name }}.yaml
    missingFileHandler: Warn

  - name: dragonfly
    namespace: queue
    chart: dragonfly/dragonfly
    version: v1.1.8
    createNamespace: true
    needs:
      - dragonfly-system/dragonfly-operator
    values:
      - values/dragonfly.yaml
      - values/{{ .Environment.Name }}.yaml
    missingFileHandler: Warn

  # ============================================================================
  # KEDA
  # ============================================================================
  # Event-driven autoscaling for Kubernetes workloads
  # Scales workers based on Dragonfly queue depth or cron schedules
  - name: keda
    namespace: keda
    chart: kedacore/keda
    createNamespace: true
    values:
      - values/common.yaml
      - values/{{ .Environment.Name }}.yaml
    missingFileHandler: Warn
