apiVersion: v1
kind: Namespace
metadata:
  name: mem0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mem0-config
  namespace: mem0
data:
  POSTGRES_HOST: postgresql.database.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: memorydb
  POSTGRES_USER: memuser
---
apiVersion: v1
kind: Secret
metadata:
  name: mem0-secret
  namespace: mem0
type: Opaque
stringData:
  POSTGRES_PASSWORD: changeme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0
  namespace: mem0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mem0
  template:
    metadata:
      labels:
        app: mem0
    spec:
      containers:
        - name: mem0
          image: mem0/mem0-api-server:0.1.0
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mem0-config
            - secretRef:
                name: mem0-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mem0
  namespace: mem0
spec:
  type: ClusterIP
  selector:
    app: mem0
  ports:
    - port: 8000
      targetPort: 8000
      name: http
