apiVersion: v1
kind: Namespace
metadata:
  name: lightrag
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightrag-config
  namespace: lightrag
data:
  POSTGRES_HOST: "postgresql-cluster-rw.database.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "lightrag"
  POSTGRES_USER: "app"
  PORT: "9621"
  WORKING_DIR: "/app/rag"
  KV_STORAGE: "PGKVStorage"
  VECTOR_STORAGE: "PGVectorStorage"
  GRAPH_STORAGE: "PGGraphStorage"
  DOC_STATUS_STORAGE: "PGDocStatusStorage"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_DIM: "1536"
  LLM_MODEL: "gpt-4o-mini"
---
apiVersion: v1
kind: Secret
metadata:
  name: lightrag-secret
  namespace: lightrag
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme-dev"
  LLM_BINDING_API_KEY: "sk-placeholder"
  EMBEDDING_BINDING_API_KEY: "sk-placeholder"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightrag-rag-storage
  namespace: lightrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightrag-inputs
  namespace: lightrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightrag
  namespace: lightrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightrag
  template:
    metadata:
      labels:
        app: lightrag
    spec:
      containers:
        - name: lightrag
          image: ghcr.io/hkuds/lightrag:v1.4.9.10
          ports:
            - containerPort: 9621
              name: http
          envFrom:
            - configMapRef:
                name: lightrag-config
            - secretRef:
                name: lightrag-secret
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: rag-storage
              mountPath: /app/rag
            - name: inputs
              mountPath: /app/inputs
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 9621
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9621
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: rag-storage
          persistentVolumeClaim:
            claimName: lightrag-rag-storage
        - name: inputs
          persistentVolumeClaim:
            claimName: lightrag-inputs
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lightrag
  namespace: lightrag
spec:
  type: ClusterIP
  selector:
    app: lightrag
  ports:
    - port: 9621
      targetPort: 9621
      name: http
