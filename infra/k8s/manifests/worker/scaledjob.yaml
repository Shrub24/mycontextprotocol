apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: omni-worker
  namespace: mycontextprotocol
spec:
  jobTargetRef:
    template:
      metadata:
        labels:
          app: omni-worker
      spec:
        containers:
        - name: worker
          image: ghcr.io/code-yeongyu/mycontextprotocol/worker:latest
          imagePullPolicy: Always
          envFrom:
          - configMapRef:
              name: gateway-config
          - secretRef:
              name: gateway-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
        restartPolicy: OnFailure
  pollingInterval: 30
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  maxReplicaCount: 10
  scalingStrategy:
    strategy: default
  triggers:
  - type: redis
    metadata:
      address: dragonfly.queue.svc.cluster.local:6379
      listName: ingestion_queue
      listLength: "1"
      activationListLength: "1"
