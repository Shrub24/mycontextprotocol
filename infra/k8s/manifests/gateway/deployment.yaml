apiVersion: v1
kind: Namespace
metadata:
  name: mycontextprotocol
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: mycontextprotocol
data:
  MEM0_POSTGRES_HOST: "postgresql-cluster-rw.database.svc.cluster.local"
  MEM0_POSTGRES_PORT: "5432"
  MEM0_POSTGRES_DATABASE: "mem0"
  MEM0_POSTGRES_USER: "app"
  
  LLAMAINDEX_POSTGRES_HOST: "postgresql-cluster-rw.database.svc.cluster.local"
  LLAMAINDEX_POSTGRES_PORT: "5432"
  LLAMAINDEX_POSTGRES_DATABASE: "llamaindex"
  LLAMAINDEX_POSTGRES_USER: "app"
  
  DRAGONFLY_HOST: "dragonfly.queue.svc.cluster.local"
  DRAGONFLY_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: mycontextprotocol
type: Opaque
stringData:
  MEM0_POSTGRES_PASSWORD: "changeme"
  LLAMAINDEX_POSTGRES_PASSWORD: "changeme"
  LLAMAINDEX_OPENAI_API_KEY: "sk-..."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mycontextprotocol
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: ghcr.io/code-yeongyu/mycontextprotocol/gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: gateway-config
        - secretRef:
            name: gateway-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: mycontextprotocol
  labels:
    app: gateway
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: gateway
