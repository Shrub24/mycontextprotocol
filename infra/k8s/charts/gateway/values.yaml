replicaCount: 2

image:
  repository: ghcr.io/shrub24/mycontextprotocol
  tag: gateway-latest
  pullPolicy: Always

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

config:
  mem0:
    postgresHost: postgresql-cluster-rw.database.svc.cluster.local
    postgresPort: "5432"
    postgresDatabase: mem0
    postgresUser: app
  
  llamaindex:
    postgresHost: postgresql-cluster-rw.database.svc.cluster.local
    postgresPort: "5432"
    postgresDatabase: llamaindex
    postgresUser: app
  
  dragonfly:
    host: dragonfly.queue.svc.cluster.local
    port: "6379"

secrets:
  mem0PostgresPassword: "changeme"
  llamaindexPostgresPassword: "changeme"
  llamaindexOpenaiApiKey: "sk-..."
