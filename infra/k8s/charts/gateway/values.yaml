replicaCount: 2

image:
  repository: ghcr.io/shrub24/mycontextprotocol
  tag: gateway-latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

livenessProbe:
  httpGet:
    path: /livez
    port: 8000
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8000
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 2

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: 1000m

config:
  mem0:
    postgresHost: postgresql-cluster-rw.database.svc.cluster.local
    postgresPort: "5432"
    postgresDatabase: mem0
    postgresUser: app
  dragonfly:
    host: dragonfly.queue.svc.cluster.local
    port: "6379"
  llamaindex:
    postgresHost: postgresql-cluster-rw.database.svc.cluster.local
    postgresPort: "5432"
    postgresDatabase: llamaindex
    postgresUser: app

secrets:
  mem0PostgresPassword: "changeme-dev"
  llamaindexPostgresPassword: "changeme-dev"
  llamaindexOpenaiApiKey: "sk-dev-placeholder"
