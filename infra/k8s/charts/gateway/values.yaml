replicaCount: 2

image:
  repository: ghcr.io/shrub24/mycontextprotocol
  tag: gateway-latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

livenessProbe:
  httpGet:
    path: /livez
    port: 8000
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8000
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 2

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: 1000m

externalSecrets:
  enabled: true
  create: false
  secretName: mycontextprotocol-external
  existingSecretName: mycontextprotocol-external
  data: {}

config: {}
