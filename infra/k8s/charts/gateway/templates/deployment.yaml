{{- $config := default (dict) .Values.config -}}
{{- $postgres := default (dict) (get $config "postgres") -}}
{{- $images := default (dict) .Values.images -}}
{{- $gatewayImage := default (dict) (get $images "gateway") -}}
{{- $image := default (dict) .Values.image -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: "{{ default (get $image "repository") (get $gatewayImage "repository") }}:{{ default (get $image "tag") (get $gatewayImage "tag") }}"
          imagePullPolicy: {{ default (get $image "pullPolicy") (get $gatewayImage "pullPolicy") }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          envFrom:
            - configMapRef:
                name: gateway-config
            {{- include "mcp-lib.externalSecrets.envFrom" . | nindent 12 }}
          env:
            - name: MEM0_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "mycontextprotocol-db-app" (get $postgres "appSecretName") | quote }}
                  key: password
            - name: LLAMAINDEX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "mycontextprotocol-db-app" (get $postgres "appSecretName") | quote }}
                  key: password
            - name: DRAGONFLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dragonfly-password
                  key: password
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
