apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: mycontextprotocol
type: Opaque
stringData:
  MEM0_POSTGRES_PASSWORD: {{ .Values.secrets.mem0PostgresPassword | quote }}
  LLAMAINDEX_POSTGRES_PASSWORD: {{ .Values.secrets.llamaindexPostgresPassword | quote }}
  LLAMAINDEX_OPENAI_API_KEY: {{ .Values.secrets.llamaindexOpenaiApiKey | quote }}
