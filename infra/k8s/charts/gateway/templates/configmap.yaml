apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: mycontextprotocol
data:
  MEM0_POSTGRES_HOST: {{ .Values.config.mem0.postgresHost | quote }}
  MEM0_POSTGRES_PORT: {{ .Values.config.mem0.postgresPort | quote }}
  MEM0_POSTGRES_DATABASE: {{ .Values.config.mem0.postgresDatabase | quote }}
  MEM0_POSTGRES_USER: {{ .Values.config.mem0.postgresUser | quote }}
  
  LLAMAINDEX_POSTGRES_HOST: {{ .Values.config.llamaindex.postgresHost | quote }}
  LLAMAINDEX_POSTGRES_PORT: {{ .Values.config.llamaindex.postgresPort | quote }}
  LLAMAINDEX_POSTGRES_DATABASE: {{ .Values.config.llamaindex.postgresDatabase | quote }}
  LLAMAINDEX_POSTGRES_USER: {{ .Values.config.llamaindex.postgresUser | quote }}
  
  DRAGONFLY_HOST: {{ .Values.config.dragonfly.host | quote }}
  DRAGONFLY_PORT: {{ .Values.config.dragonfly.port | quote }}
