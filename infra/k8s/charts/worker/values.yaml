image:
  repository: ghcr.io/shrub24/mycontextprotocol
  tag: worker-latest
  pullPolicy: Always

scaledjob:
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

config:
  dragonfly:
    host: dragonfly.queue.svc.cluster.local
    port: "6379"
    queueName: ingestion_queue
  
  llamaindex:
    postgresHost: postgresql-cluster-rw.database.svc.cluster.local
    postgresPort: "5432"
    postgresDatabase: llamaindex
    postgresUser: app

secrets:
  dragonflyPassword: "changeme"
  llamaindexPostgresPassword: "changeme"
  llamaindexOpenaiApiKey: "sk-..."
