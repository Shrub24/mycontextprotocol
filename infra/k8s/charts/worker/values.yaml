image:
  repository: ghcr.io/shrub24/mycontextprotocol
  tag: worker-latest
  pullPolicy: IfNotPresent

scaling:
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 30
  queueLength: 5

scaledjob:
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 1Gi
    cpu: 2000m

config:
  dragonfly:
    host: dragonfly.queue.svc.cluster.local
    port: "6379"
    queueName: ingestion_queue
  llamaindex:
    postgresHost: postgresql-cluster-rw.database.svc.cluster.local
    postgresPort: "5432"
    postgresDatabase: llamaindex
    postgresUser: app

secrets:
  dragonflyPassword: "changeme-dev"
  llamaindexPostgresPassword: "changeme-dev"
  llamaindexOpenaiApiKey: "sk-dev-placeholder"
