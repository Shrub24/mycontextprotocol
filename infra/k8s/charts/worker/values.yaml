image:
  repository: ghcr.io/shrub24/mycontextprotocol
  tag: worker-latest
  pullPolicy: IfNotPresent

scaling:
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 30
  queueLength: 5

scaledjob:
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 1Gi
    cpu: 2000m

externalSecrets:
  enabled: true
  create: false
  secretName: mycontextprotocol-external
  existingSecretName: mycontextprotocol-external
  data: {}

config: {}
