{{- $config := default (dict) .Values.config -}}
{{- $postgres := default (dict) (get $config "postgres") -}}
{{- $images := default (dict) .Values.images -}}
{{- $workerImage := default (dict) (get $images "worker") -}}
{{- $image := default (dict) .Values.image -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  minReplicaCount: {{ .Values.scaledjob.minReplicaCount }}
  maxReplicaCount: {{ .Values.scaledjob.maxReplicaCount }}
  pollingInterval: {{ .Values.scaledjob.pollingInterval }}
  successfulJobsHistoryLimit: {{ .Values.scaledjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.scaledjob.failedJobsHistoryLimit }}
  
  jobTargetRef:
    activeDeadlineSeconds: 300
    template:
      spec:
        restartPolicy: OnFailure
        containers:
          - name: worker
            image: "{{ default (get $image "repository") (get $workerImage "repository") }}:{{ default (get $image "tag") (get $workerImage "tag") }}"
            imagePullPolicy: {{ default (get $image "pullPolicy") (get $workerImage "pullPolicy") }}
            envFrom:
              - configMapRef:
                  name: worker-config
              {{- include "mcp-lib.externalSecrets.envFrom" . | nindent 14 }}
            env:
              - name: MEM0_POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: {{ default "mycontextprotocol-db-app" (get $postgres "appSecretName") | quote }}
                    key: password
              - name: LLAMAINDEX_POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: {{ default "mycontextprotocol-db-app" (get $postgres "appSecretName") | quote }}
                    key: password
              - name: DRAGONFLY_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: dragonfly-password
                    key: password
            resources:
              requests:
                cpu: {{ .Values.resources.requests.cpu | quote }}
                memory: {{ .Values.resources.requests.memory | quote }}
              limits:
                cpu: {{ .Values.resources.limits.cpu | quote }}
                memory: {{ .Values.resources.limits.memory | quote }}
  
  triggers:
  - type: redis
    metadata:
      addressFromEnv: DRAGONFLY_HOST
      passwordFromEnv: DRAGONFLY_PASSWORD
      listName: {{ default "mcp_ingest" (get (default (dict) (get (default (dict) .Values.config) "dragonfly")) "queueName") }}
      listLength: "1"
