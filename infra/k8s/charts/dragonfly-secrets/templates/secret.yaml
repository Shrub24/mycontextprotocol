{{- $secret := (lookup "v1" "Secret" .Release.Namespace "dragonfly-password") -}}
{{- $password := "" -}}
{{- if $secret -}}
  {{- $password = index $secret.data "password" | b64dec -}}
{{- else -}}
  {{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-password
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ $password | quote }}
