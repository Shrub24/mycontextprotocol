{{- $config := default (dict) .Values.config -}}
{{- $lightrag := default (dict) (get $config "lightrag") -}}
{{- $postgres := default (dict) (get $config "postgres") -}}
{{- $openai := default (dict) (get $config "openai") -}}
{{- $openaiBase := default (get $openai "apiBase") (get $lightrag "openaiApiBase") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lightrag.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "lightrag.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "lightrag.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "lightrag.fullname" . }}
    spec:
      containers:
        - name: lightrag
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            {{- toYaml .Values.env | nindent 12 }}
            - name: POSTGRES_HOST
              value: {{ default "mycontextprotocol-db-rw" (get $lightrag "postgresHost") | quote }}
            - name: POSTGRES_PORT
              value: {{ default "5432" (get $lightrag "postgresPort") | quote }}
            - name: POSTGRES_USER
              value: {{ default "app" (get $lightrag "postgresUser") | quote }}
            - name: POSTGRES_DATABASE
              value: {{ default "lightrag" (get $lightrag "postgresDatabase") | quote }}
            - name: POSTGRES_WORKSPACE
              value: {{ default "default" (get $lightrag "postgresWorkspace") | quote }}
            {{- if $openaiBase }}
            - name: LLM_BINDING_HOST
              value: {{ $openaiBase | quote }}
            - name: EMBEDDING_BINDING_HOST
              value: {{ $openaiBase | quote }}
            {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "mycontextprotocol-db-app" (get $postgres "appSecretName") | quote }}
                  key: password
          envFrom:
            {{- include "mcp-lib.externalSecrets.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: rag-storage
              mountPath: /app/rag
            - name: inputs
              mountPath: /app/inputs
            {{- end }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: rag-storage
          persistentVolumeClaim:
            claimName: {{ include "lightrag.fullname" . }}-rag-storage
        - name: inputs
          persistentVolumeClaim:
            claimName: {{ include "lightrag.fullname" . }}-inputs
        {{- end }}
        - name: tmp
          emptyDir: {}
